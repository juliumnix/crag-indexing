# Example versions configuration
# Copy this file to versions.yaml and customize for your project

versions:
  - version: "1.0.0"
    release_date: "2023-01-15"
    changelog:
      - "Initial release"

  - version: "2.0.0"
    release_date: "2024-01-20"
    breaking_changes:
      - title: "Authentication changed to OAuth2"
        description: "Basic auth was removed in v2.0.0"
        severity: "critical"
        affected:
          - "POST /api/login"
          - "GET /api/users"
        migration: "docs/migration/v1-to-v2.md"
      
      - title: "Response format changed"
        description: "All responses now wrapped in { data, meta }"
        severity: "major"
        affected:
          - "All API endpoints"
    
    deprecated:
      - endpoint: "GET /api/v1/users"
        reason: "Use /api/v2/users instead"
        removed_in: "3.0.0"

  - version: "3.0.0"
    release_date: "2025-03-01"
    breaking_changes:
      - title: "Legacy endpoints removed"
        description: "All /api/v1/* endpoints removed"
        severity: "critical"
        affected:
          - "GET /api/v1/users"
          - "POST /api/v1/auth"

